services:
  terraria-server:
    container_name: 'terraria-server'
    hostname: 'terraria-server'
    stdin_open: true
    tty: true
    build:
      context: .
    user: 1000:1000
    ports:
      - '7777:7777/tcp'
    volumes:
      - './terraria-server:/server/worlds'
    restart: unless-stopped
