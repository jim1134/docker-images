services:
  init:
    image: alpine
    volumes:
      - './satisfactory-server:/data'
    command: chown -R 1000:1000 /data

  satisfactory-server:
    container_name: 'satisfactory-server'
    hostname: 'satisfactory-server'
    build:
      context: .
    user: 1000:1000
    ports:
      - '7777:7777/tcp'
      - '7777:7777/udp'
      - '8888:8888/tcp'
    volumes:
      - './satisfactory-server:/home/steam/config'
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
